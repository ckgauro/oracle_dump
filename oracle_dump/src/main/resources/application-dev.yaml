# Local development profile:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Uses an in-memory DB and a local scan directory that is created on startup so you can drop
# .dmp files into ./var/oracle-dumps/client-a and watch the pipeline pick them up.
spring:
  datasource:
    url: jdbc:h2:mem:oracle-import;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    com.demo.oracle_dump: DEBUG

oracle-import:
  scanner:
    interval: 10s
    stable-file-check-delay: 5s
    create-missing-directories: true
  processing:
    poll-interval: 5s
    retry-backoff: 15s
  importer:
    mode: mock
    mock-duration: 3s
  clients:
    - client-id: client-a
      enabled: true
      dump-directory: "./var/oracle-dumps/client-a"
      source-schema: APP
      target-schema: CLIENT_A
      oracle-directory-name: CLIENT_A_IMPORT_DIR
      max-parallel-imports: 1
    - client-id: client-b
      enabled: true
      dump-directory: "./var/oracle-dumps/client-b"
      target-schema: CLIENT_B
      oracle-directory-name: CLIENT_B_IMPORT_DIR
      max-parallel-imports: 2
