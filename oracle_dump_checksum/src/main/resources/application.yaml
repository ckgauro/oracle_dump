spring:
  application:
    name: checksum-service

  datasource:
    url: jdbc:h2:file:./data/checksum-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

checksum:
  algorithm: SHA-256
  executor:
    type: virtual        # virtual (default) | fixed
    fixed-pool-size: 4
  scan:
    cron: "0/30 * * * * *"   # every 30 seconds
